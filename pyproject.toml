# Tool configuration only. Nothing here is installable: the Houdini half is
# put on PYTHONPATH by fxhoudinimotion.json, and the model servers in server/
# run inside the kimodo:1.0 image from docker-compose.bridge.yaml. A [project] table
# would describe a package that no one pip installs.

[tool.ruff]
# Houdini 20.5+ ships Python 3.11; the servers run in the kimodo:1.0 image
# (NGC pytorch 24.10, Python 3.10). py310 is the floor both clear.
target-version = "py310"
line-length = 80
extend-exclude = ["vendor", "backup", "houdini/otls"]

[tool.ruff.format]
# soma77.py is one long data table and its row grouping is the data: one line
# per limb, per finger chain, per side. Formatting it would put one element on
# each line and make 77 joints unreadable. The 1.1 HDA embeds its own frozen
# copy, so this file can change without touching it.
#
# Markdown, because ruff 0.16 started formatting the Python blocks inside
# it. The snippets in CONTRIBUTING.md and docs/ are written to be read and
# pasted, not to be black-clean: the live-test line is one statement on
# purpose, so it can go into Houdini's Python Shell in one paste.
exclude = [
    "houdini/python/fxmotion/skeletons/soma77.py",
    "houdini/python/fxmotion/skeletons/ardy_core.py",
    "*.md",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = [
    # Line length is the formatter's call, not a second opinion.
    "E501",
    # `"%s" % x` is used consistently across the panel, the scripts and the
    # tests. Converting 62 sites to f-strings would churn working code.
    "UP031",
    # Optional[X] over X | None: the pydantic models in server/fxmotion_server.py
    # resolve their annotations at runtime, inside kimodo:1.0 (Python
    # 3.10). Optional works on every version.
    "UP045",
]

[tool.ruff.lint.isort]
known-first-party = ["fxmotion", "fxmotion_server", "kimodo_adapter", "kimodo_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fxmotion lives in houdini/python and the model servers in server/; both are
# plain directories on PYTHONPATH in production (the Houdini package file, the
# container's PYTHONPATH), so the tests see them the same way.
pythonpath = ["houdini/python", "server"]
# test_houdini_live.py imports hou at module level and drives real widgets, so
# it only runs inside a running Houdini session, not hython and not here.
# CONTRIBUTING.md says how to run it.
addopts = "--ignore=tests/test_houdini_live.py"
